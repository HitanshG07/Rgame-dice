<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Forge - V5 Mobile Arcade Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="arcade-bg">
        <div class="pattern-overlay"></div>
    </div>

    <div class="mobile-hud">
        <!-- Top Floating Island Nav -->
        <header class="island-nav">
            <div class="badge-profile">
                <div class="avatar-box"><i class="fa-solid fa-face-smile"></i></div>
                <div class="p-level">LVL 42</div>
            </div>

            <div class="pill-stats">
                <div class="stat-pill cash">
                    <i class="fa-solid fa-coins"></i>
                    <span>$7.96K</span>
                    <button class="plus-b">+</button>
                </div>
                <div class="stat-pill gems">
                    <i class="fa-solid fa-gem"></i>
                    <span>1,250</span>
                    <button class="plus-b">+</button>
                </div>
            </div>

            <div class="island-actions">
                <button class="round-btn orange" onclick="toggleModal('shopModal')"><i class="fa-solid fa-store"></i></button>
                <button class="round-btn blue" onclick="toggleModal('settingsModal')"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <!-- Center Stage -->
        <main class="arcade-stage">
            
            <!-- Streak Banner Card -->
            <div class="streak-card-banner">
                <div class="streak-badge">MULTIPLIER</div>
                <div class="streak-number">12.4X</div>
                <div class="streak-sub-info">
                    <span class="safe"><i class="fa-solid fa-bolt"></i> 14 ROLLS</span>
                    <span class="danger"><i class="fa-solid fa-triangle-exclamation"></i> 8.2% VOID</span>
                </div>
            </div>

            <!-- Floating 3D Dice Display -->
            <div class="arcade-dice-display">
                <div class="chunky-d6">
                    <div class="c-face c-front">6</div>
                    <div class="c-face c-back">1</div>
                    <div class="c-face c-right">4</div>
                    <div class="c-face c-left">3</div>
                    <div class="c-face c-top">5</div>
                    <div class="c-face c-bottom">2</div>
                </div>
            </div>

            <!-- Big Hit Pop -->
            <div class="big-hit-card">+ $1,450,000</div>

        </main>

        <!-- Left Dock Cards -->
        <aside class="arcade-dock left">
            <button class="arcade-card forge-btn-card" onclick="toggleModal('forgeModal')">
                <div class="card-icon-wrapper orange-glow"><i class="fa-solid fa-hammer"></i></div>
                <div class="card-info">
                    <span class="c-title">FORGE</span>
                    <span class="c-desc">CUSTOMIZE</span>
                </div>
            </button>

            <button class="arcade-card">
                <div class="card-icon-wrapper cyan-glow"><i class="fa-solid fa-shapes"></i></div>
                <div class="card-info">
                    <span class="c-title">SHAPE</span>
                    <span class="c-desc">D4 - D20</span>
                </div>
            </button>

            <button class="arcade-card">
                <div class="card-icon-wrapper purple-glow"><i class="fa-solid fa-layer-group"></i></div>
                <div class="card-info">
                    <span class="c-title">SLOTS</span>
                    <span class="c-desc">3 ACTIVE</span>
                </div>
            </button>
        </aside>

        <!-- Right Dock Cards -->
        <aside class="arcade-dock right">
            <button class="arcade-card">
                <div class="card-icon-wrapper yellow-glow"><i class="fa-solid fa-trophy"></i></div>
                <div class="card-info">
                    <span class="c-title">RANKS</span>
                    <span class="c-desc">TOP 1%</span>
                </div>
            </button>

            <button class="arcade-card" onclick="toggleModal('statsModal')">
                <div class="card-icon-wrapper green-glow"><i class="fa-solid fa-chart-pie"></i></div>
                <div class="card-info">
                    <span class="c-title">STATS</span>
                    <span class="c-desc">EV METRICS</span>
                </div>
            </button>

            <button class="arcade-card prestige-card">
                <div class="card-icon-wrapper red-glow"><i class="fa-solid fa-wand-magic"></i></div>
                <div class="card-info">
                    <span class="c-title">REBIRTH</span>
                    <span class="c-desc">BOOST</span>
                </div>
            </button>
        </aside>

        <!-- Bottom Controller Bar -->
        <footer class="arcade-footer">
            <div class="toggle-pill">
                <span>AUTO</span>
                <input type="checkbox" id="autoCheck" checked>
            </div>

            <button class="mega-roll-button" id="megaRoll">
                <div class="b-shadow"></div>
                <div class="b-face">
                    <i class="fa-solid fa-dice-three"></i>
                    <span>ROLL!</span>
                </div>
            </button>

            <div class="speed-pill">
                <span>2X SPEED</span>
            </div>
        </footer>

    </div>

    <!-- FORGE MODAL FOR V5 -->
    <div class="v5-modal-bg" id="forgeModal" style="display: none;">
        <div class="v5-modal-card">
            <header class="v5-header">
                <h2><i class="fa-solid fa-hammer"></i> FORGE WORKSHOP</h2>
                <button class="v5-close" onclick="toggleModal('forgeModal')"><i class="fa-solid fa-xmark"></i></button>
            </header>

            <div class="v5-body">
                <div class="v5-face-list">
                    <div class="v5-row">
                        <span class="v5-id">F1</span>
                        <span class="v5-tag fire">FIRE</span>
                        <span class="v5-val">MASS: 25</span>
                        <span class="v5-val">$2,500</span>
                        <div class="v5-ctrls"><button>-</button><button>+</button></div>
                    </div>
                    <div class="v5-row">
                        <span class="v5-id">F2</span>
                        <span class="v5-tag ice">ICE</span>
                        <span class="v5-val">MASS: 15</span>
                        <span class="v5-val">$1,500</span>
                        <div class="v5-ctrls"><button>-</button><button>+</button></div>
                    </div>
                </div>

                <div class="v5-side">
                    <div class="v5-sec-title">PICK ELEMENT</div>
                    <div class="v5-chips">
                        <button class="v5-chip active">FIRE</button>
                        <button class="v5-chip">ICE</button>
                        <button class="v5-chip">GOLD</button>
                    </div>

                    <div class="v5-sec-title">PICK SHAPE</div>
                    <div class="v5-chips">
                        <button class="v5-chip">D4</button>
                        <button class="v5-chip active">D6</button>
                        <button class="v5-chip">D20</button>
                    </div>

                    <button class="v5-action-btn">APPLY FORGE ($1,250)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'none') ? 'flex' : 'none';
        }
    </script>
</body>
</html>
